name: Tests et publication du site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôles des données
        run: python -m unittest discover tests -v
      - name: Aperçu du site (téléchargeable depuis l'exécution)
        uses: actions/upload-artifact@v4
        with:
          name: apercu-du-site
          path: site/index.html
          retention-days: 14

  pages:
    # Ne publie le site que si le dépôt est public (GitHub Pages indisponible en privé sur un compte gratuit)
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
